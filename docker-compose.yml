name: go-backend-starter
services:
  api:
    container_name: starter-api
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    image: starter-api
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - env/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: starter-postgres
    environment:
      POSTGRES_DB: go-backend-starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go-backend-starter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Only add this node-exporter if you want to monitor this API

  # node-exporter:
